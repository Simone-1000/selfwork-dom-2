<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfwork DOM 2</title>
</head>
<body>

    <h1>Crea un articolo</h1>

    <label for="titolo">Titolo:</label>
    <input type="text" id="titolo" placeholder="Inserisci il titolo">

    <br><br>

    <label for="paragrafo">Paragrafo:</label>
    <br>
    <textarea id="paragrafo" rows="5" cols="40"
        placeholder="Inserisci il paragrafo"></textarea>

    <br><br>

    <button type="button" id="crea-articolo">Crea articolo</button>

    <hr>

    <div id="articoli"></div>

    <script src="main.js"></script>
</body>
</html>
